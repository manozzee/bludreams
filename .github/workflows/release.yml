name: Release BluDreams

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (optional — defaults to v<versionName> from libs.versions.toml)"
        required: false
        type: string
      release_title:
        description: "Release title (optional — defaults to BluDreams v<versionName>)"
        required: false
        type: string

concurrency:
  group: "release-bludreams"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Stable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_TITLE: ${{ inputs.release_title }}
        run: |
          VERSION_NAME=$(grep -E '^versionName[[:space:]]*=' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse versionName from gradle/libs.versions.toml"
            exit 1
          fi

          TAG="${INPUT_TAG:-v${VERSION_NAME}}"
          TITLE="${INPUT_TITLE:-BluDreams v${VERSION_NAME}}"
          APK_NAME="BluDreams-v${VERSION_NAME}.apk"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

          echo "Resolved release metadata: version=${VERSION_NAME}, tag=${TAG}, apk=${APK_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ]; then
            mkdir -p "${RUNNER_TEMP}/keystore"
            KEYSTORE_FILE="${RUNNER_TEMP}/keystore/release.jks"
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Using release keystore from repository secrets."
          else
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets configured; falling back to debug signing."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Stable Release APK
        run: ./gradlew :app:assembleStableRelease
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Package APK asset
        run: |
          BUILT_APK=$(find app/build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/stable/release"
            exit 1
          fi
          mkdir -p release_assets
          cp "$BUILT_APK" "release_assets/${{ steps.meta.outputs.apk_name }}"
          ls -lh release_assets/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bludreams-v${{ steps.meta.outputs.version_name }}
          path: release_assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          files: release_assets/${{ steps.meta.outputs.apk_name }}
