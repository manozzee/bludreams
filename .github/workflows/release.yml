name: Release BluDreams

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional — defaults to v<versionName> from libs.versions.toml, e.g. v1.1.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: "release-bludreams"
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Stable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and release metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION_NAME=$(grep -E '^versionName[[:space:]]*=' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse versionName from gradle/libs.versions.toml"
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${VERSION_NAME}"
          fi

          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi

          TITLE="BluDreams ${TAG}"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${TITLE}" >> "$GITHUB_OUTPUT"

          echo "Resolved release metadata: version=${VERSION_NAME}, tag=${TAG}, title=${TITLE}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=()
          [ -z "$KEYSTORE_B64" ] && MISSING_SECRETS+=("SIGNING_KEYSTORE_BASE64")
          [ -z "$SIGNING_KEY_ALIAS" ] && MISSING_SECRETS+=("SIGNING_KEY_ALIAS")
          [ -z "$SIGNING_STORE_PASSWORD" ] && MISSING_SECRETS+=("SIGNING_STORE_PASSWORD")
          [ -z "$SIGNING_KEY_PASSWORD" ] && MISSING_SECRETS+=("SIGNING_KEY_PASSWORD")

          if [ "${#MISSING_SECRETS[@]}" -gt 0 ]; then
            echo "::error::Missing required release signing secret(s): ${MISSING_SECRETS[*]}. Configure them under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/keystore"
          KEYSTORE_FILE="${RUNNER_TEMP}/keystore/release.jks"
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded release keystore file is empty. Verify SIGNING_KEYSTORE_BASE64."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" >/dev/null; then
            echo "::error::Failed to verify keystore with SIGNING_KEY_ALIAS and SIGNING_STORE_PASSWORD."
            exit 1
          fi

          echo "keystore_path=${KEYSTORE_FILE}" >> "$GITHUB_OUTPUT"
          echo "Verified release keystore and alias '${SIGNING_KEY_ALIAS}'."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Stable Release APK
        run: ./gradlew :app:assembleStableRelease
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Clean up temporary keystore
        if: always()
        run: rm -rf "${RUNNER_TEMP}/keystore"

      - name: Prepare & verify signed release APK
        run: |
          BUILT_APK=$(find app/build/outputs/apk/stable/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/stable/release"
            exit 1
          fi
          TARGET_APK="app/build/outputs/apk/stable/release/BluDreams-${{ steps.meta.outputs.tag_name }}.apk"
          if [ "$BUILT_APK" != "$TARGET_APK" ]; then
            mv "$BUILT_APK" "$TARGET_APK"
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name 'apksigner' 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Could not locate apksigner in $SDK_ROOT/build-tools"
            exit 1
          fi

          VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$TARGET_APK")
          echo "$VERIFY_OUTPUT"

          if echo "$VERIFY_OUTPUT" | grep -q "CN=Android Debug, O=Android, C=US"; then
            echo "::error::Release APK was signed with the Android Debug certificate instead of the release keystore!"
            exit 1
          fi

          ls -lh app/build/outputs/apk/stable/release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_title }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/stable/release/*.apk
